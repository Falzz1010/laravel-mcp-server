name: Socket Security

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

permissions:
  contents: read

jobs:
  socket-security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Socket CLI
        run: npm install -g @socketsecurity/cli
          
      - name: Run Socket Security Scan
        run: npx socket npm audit
        continue-on-error: true
        
      - name: Socket Report Summary
        if: always()
        run: |
          echo "✅ Socket Security scan completed"
          echo "📊 Check output above for any security alerts"
          echo "ℹ️  Install Socket GitHub App for detailed reports: https://socket.dev/"
