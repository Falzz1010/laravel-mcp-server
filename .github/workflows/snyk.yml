name: Snyk Security Scan (Disabled - Requires Token)

# Uncomment 'on' section and add SNYK_TOKEN secret to enable
# on:
#   schedule:
#     - cron: '0 0 * * *'
#   workflow_dispatch:

on:
  workflow_dispatch:  # Manual only

jobs:
  security:
    runs-on: ubuntu-latest
    if: false  # Disabled until SNYK_TOKEN is configured
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
      
      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
